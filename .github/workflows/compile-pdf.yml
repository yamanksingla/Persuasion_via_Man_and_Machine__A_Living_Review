name: Compile LaTeX and Publish PDF

on:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '**.bib'
      - '**.bst'
      - '**.sty'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: false
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error
          extra_system_packages: "bibtex"

      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add main.pdf
          if git diff --staged --quiet; then
            echo "No changes to PDF — skipping commit"
          else
            git commit -m "Auto-compile: update main.pdf [skip ci]"
            git push
          fi
