name: Compile LaTeX and Publish PDF

on:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '**.bib'
      - '**.bst'
      - '**.sty'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX (pdflatex → bibtex → pdflatex × 2)
        run: |
          pdflatex -interaction=nonstopmode -file-line-error main.tex || true
          bibtex main || true
          pdflatex -interaction=nonstopmode -file-line-error main.tex || true
          pdflatex -interaction=nonstopmode -file-line-error main.tex || true
          test -f main.pdf && echo "PDF generated successfully: $(ls -lh main.pdf)" || (echo "ERROR: PDF not generated" && exit 1)

      - name: Commit compiled PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add main.pdf
          if git diff --staged --quiet; then
            echo "No changes to PDF — skipping commit"
          else
            git commit -m "Auto-compile: update main.pdf [skip ci]"
            git push
          fi
